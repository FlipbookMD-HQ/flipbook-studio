<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" fill="none">
  <defs>
    <linearGradient id="fsw-bg" x1="0" y1="0" x2="920" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="fsw-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c1ff"/>
      <stop offset="50%" stop-color="#8083ff"/>
      <stop offset="100%" stop-color="#494bd6"/>
    </linearGradient>
    <linearGradient id="fsw-cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8083ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4edea3" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="fsw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#05070b" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Full-Bleed Square Banner Base (No rounded outer border) -->
  <rect width="920" height="240" fill="url(#fsw-bg)"/>

  <!-- Left Studio Icon Mark (Frameless, scaled up) -->
  <g transform="translate(22, 18) scale(1.16)">
    <!-- Workbench Shell -->
    <g filter="url(#fsw-shadow)">
      <rect x="24" y="28" width="128" height="120" rx="11" fill="#14181f" stroke="url(#fsw-indigo)" stroke-width="2"/>
      <line x1="25" y1="46" x2="151" y2="46" stroke="#31353c" stroke-width="1.5"/>
      <circle cx="36" cy="37" r="2.2" fill="#8083ff"/>
      <circle cx="43" cy="37" r="2.2" fill="#494bd6"/>
      <rect x="52" y="33.5" width="28" height="7" rx="3.5" fill="#0a0e14"/>
      <circle cx="57" cy="37" r="1.8" fill="#4edea3"/>
      <line x1="61" y1="37" x2="76" y2="37" stroke="#4edea3" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Left Filmstrip Rail -->
      <rect x="31" y="53" width="24" height="88" rx="4" fill="#0a0e14" stroke="#262a31" stroke-width="1"/>
      <rect x="34.5" y="57" width="17" height="12" rx="2" fill="#1c2026"/>
      <rect x="34.5" y="73" width="17" height="12" rx="2" fill="#262a31" stroke="#8083ff" stroke-width="1.5"/>
      <rect x="34.5" y="89" width="17" height="12" rx="2" fill="#1c2026"/>
      <rect x="34.5" y="105" width="17" height="12" rx="2" fill="#1c2026"/>

      <!-- Right 3x3 Template Grid Stage -->
      <rect x="61" y="53" width="84" height="88" rx="5" fill="#0a0e14" stroke="#31353c" stroke-width="1"/>
      <line x1="89" y1="54" x2="89" y2="140" stroke="#262a31" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="117" y1="54" x2="117" y2="140" stroke="#262a31" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="62" y1="82" x2="144" y2="82" stroke="#262a31" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="62" y1="111" x2="144" y2="111" stroke="#262a31" stroke-width="1" stroke-dasharray="3 2"/>

      <!-- Active 2x2 Template Region -->
      <rect x="68" y="60" width="63" height="60" rx="5" fill="url(#fsw-cell)" stroke="#8083ff" stroke-width="2"/>
      <rect x="66" y="58" width="4.5" height="4.5" rx="1" fill="#c0c1ff"/>
      <rect x="128.5" y="58" width="4.5" height="4.5" rx="1" fill="#c0c1ff"/>
      <rect x="66" y="117.5" width="4.5" height="4.5" rx="1" fill="#c0c1ff"/>
      <rect x="128.5" y="117.5" width="4.5" height="4.5" rx="1" fill="#4edea3"/>

      <!-- Slide Lines & Verified Check -->
      <rect x="76" y="69" width="33" height="5" rx="2.5" fill="#dfe2eb"/>
      <rect x="76" y="78" width="46" height="3.5" rx="1.75" fill="#c0c1ff" opacity="0.8"/>
      <rect x="76" y="85" width="38" height="3.5" rx="1.75" fill="#c0c1ff" opacity="0.5"/>
      <rect x="76" y="99" width="28" height="10" rx="5" fill="#003824" stroke="#4edea3" stroke-width="1.2"/>
      <path d="M81.5 104L84 106.5L88.5 101.5" stroke="#4edea3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- AI Spark -->
    <path d="M134 42L136.8 50.2L145 53L136.8 55.8L134 64L131.2 55.8L123 53L131.2 50.2L134 42Z" fill="#4edea3"/>
  </g>

  <!-- Wordmark & Status Metadata -->
  <g transform="translate(238, 0)">
    <!-- Title: FLIPBOOK STUDIO -->
    <text x="0" y="108" fill="#dfe2eb" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.03em">
      FLIPBOOK <tspan fill="#c0c1ff">STUDIO</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="152" fill="#c7c4d7" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="500">
      Self-hosted visual workbench · <tspan fill="#8083ff">3×3 Grid</tspan> · <tspan fill="#4edea3">Local &amp; Cloud AI</tspan>
    </text>

    <!-- Feature Chips Row -->
    <g transform="translate(2, 174)">
      <rect x="0" y="0" width="96" height="26" rx="5" fill="#1c2026" stroke="#31353c" stroke-width="1.2"/>
      <text x="48" y="17" fill="#c0c1ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">BLUEPRINTS</text>

      <rect x="106" y="0" width="96" height="26" rx="5" fill="#1c2026" stroke="#31353c" stroke-width="1.2"/>
      <text x="154" y="17" fill="#c0c1ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">MEDIA KITS</text>

      <rect x="212" y="0" width="114" height="26" rx="5" fill="#1c2026" stroke="#31353c" stroke-width="1.2"/>
      <text x="269" y="17" fill="#4edea3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">GIT VERSIONS</text>

      <line x1="342" y1="13" x2="646" y2="13" stroke="#262a31" stroke-width="2"/>
    </g>
  </g>
</svg>
