# Weekly dependency updates. Minor and patch npm updates come as one grouped PR; majors and
# security fixes come one by one. Actions are pinned to commit SHAs and updated here too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
