name: Release

# Builds Studio and attaches it to a GitHub Release when a v<version> tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match package.json. The asset is the `npm pack` tarball under a fixed name,
# flipbook-studio.tgz, so the README's .../releases/latest/download/flipbook-studio.tgz
# always installs the newest release. A version with a "-" (0.2.0-beta.1) becomes a
# prerelease, which "latest" skips. Studio is never published to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag doesn't match package.json version $version. Bump the version or retag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          # Already built above; --ignore-scripts skips prepack, whose build output would mix with npm's.
          mkdir -p pack
          npm pack --ignore-scripts --pack-destination pack
          mv pack/*.tgz flipbook-studio.tgz
          sha256sum flipbook-studio.tgz > flipbook-studio.tgz.sha256
          cat flipbook-studio.tgz.sha256

      - name: Smoke-test the packed tarball
        run: |
          prefix="$RUNNER_TEMP/studio"
          npm install -g --prefix "$prefix" ./flipbook-studio.tgz
          "$prefix/bin/flipbook-studio" --help
          mkdir -p "$RUNNER_TEMP/ws" "$RUNNER_TEMP/cfg"
          FLIPBOOK_STUDIO_CONFIG_DIR="$RUNNER_TEMP/cfg" FLIPBOOK_HOME="$RUNNER_TEMP/lib" \
            "$prefix/bin/flipbook-studio" "$RUNNER_TEMP/ws" --no-open --port 4500 > studio.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do grep -q "URL:" studio.log && break; sleep 0.5; done
          cat studio.log
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4500/)
          kill "$pid"
          if [[ "$code" != "200" ]]; then echo "::error::Studio answered $code instead of 200."; exit 1; fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          cat > notes.md <<EOF
          Install (Node.js 20 or newer):

          \`\`\`sh
          npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/flipbook-studio.tgz
          flipbook-studio ~/decks
          \`\`\`

          Or try it without installing:

          \`\`\`sh
          npx https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/flipbook-studio.tgz ~/decks
          \`\`\`

          \`flipbook-studio.tgz.sha256\` has the tarball's SHA-256 checksum.
          EOF
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$tag" flipbook-studio.tgz flipbook-studio.tgz.sha256 \
            --title "Flipbook Studio $tag" --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"
