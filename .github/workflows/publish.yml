name: Publish

# Publishes to npm when the package.json version is not on npm yet.
# Manual-only for now (Actions → Publish → Run workflow): @flipbook-md/studio
# isn't on npm yet and npm trusted publishing isn't set up for it. To publish on
# every merge to main again, add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: write # push the v<version> tag
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Check whether this version is already published
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Run tests
        if: steps.version.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *-next.* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # A GitHub Release (release.yml) may already have created this tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; not tagging again."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
